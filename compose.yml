# ==========================================
# 1. DECLARACIÓ DE LES "PECES" (DRY)
# ==========================================

x-images:
  ollama-image: &ollama-image docker.io/ollama/ollama:0.32.15 
  hermes-image: &hermes-image docker.io/nousresearch/hermes-agent:latest   
  open-webui-image: &open-webui-image ghcr.io/open-webui/open-webui:v0.11.4 #10/Oct/26
  open-terminal-image: &open-terminal-image ghcr.io/open-webui/open-terminal:v0.14.0  #10/Oct/26

x-volumes:
  # Utilitzem :z (minúscula) per permetre compartir carpetes
  ollama-storage: &ollama-storage ./01-Volums/01_01-LLM-Ollama:/root/.ollama:Z
  ollama-sync: &ollama-sync ./01-Volums/01_02-Ollama-Sync:/sync:Z
  hermes-workspace: &hermes-workspace ./01-Volums/02_02-Agent-Hermes/workspace:/opt/data:Z
  hermes-config: &hermes-config ./01-Volums/02_02-Agent-Hermes/config:/root/.hermes:Z
  webui-storage: &webui-storage ./01-Volums/03_01-Open-WebUI:/app/backend/data:Z
  terminal-storage: &terminal-storage ./01-Volums/03_02-Open-Terminal:/home/user:Z


# ==========================================
# 2. PLANTILLA
# ==========================================

# 2.1 OLLAMA ||  Base (DRY)

x-ollama-common: &ollama-common
  image: *ollama-image
  volumes:
    - *ollama-storage
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 120s
    timeout: 3s
    retries: 5
    start_period: 5s

# ==========================================
# 3. SERVICES
# ==========================================

services:


  # ----------------------------------------
  # 3.1 OLLAMA
  # ----------------------------------------

  # 3.1.1.1 OLLAMA || PERFIL PRODUCCIÓ - Hermes
  ollama-int:
    <<: *ollama-common
    container_name: ollama-pro-int
    profiles:
      - produccio-ha
      - hermes-interna
      - hermes-externa
      - produccio-ow
    networks:
      ia-net-interna:
        aliases:
          - ollama

  # 3.1.1.2 OLLAMA || PERFIL HOST - Localhost (127.0.0.1)
  ollama-host:
    <<: *ollama-common
    container_name: ollama-pro-host
    profiles:
      - ollama-host
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - ia-net-interna

  # 3.1.1.3 OLLAMA || PERFIL EXTERN - Obert a la xarxa (0.0.0.0)
  ollama-ext:
    <<: *ollama-common
    container_name: ollama-pro-ext
    profiles:
      - ollama-ext
    ports:
      - "0.0.0.0:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS="*"
    networks:
      - ia-net-interna

  # 3.1.2 OLLAMA || PERFIL AMB INTERNET (Descàrregues)
  ollama-externa:
    <<: *ollama-common
    container_name: ollama-ex
    profiles:
      - ollama-externa
    volumes:
      - *ollama-storage
      - *ollama-sync
    entrypoint: ["/bin/bash", "/sync/sync.sh"]
    networks:
      - ia-net-externa

  # 3.1.3 OLLAMA || PERFIL Sense INTERNET (Comprovar estat Fora de la xarxa)
  ollama-interna:
    <<: *ollama-common
    container_name: ollama-in
    profiles:
      - ollama-interna
    network_mode: none


  # ----------------------------------------
  # 3.2 HERMES AGENT
  # ----------------------------------------

  # 3.2.1 HERMES || PRODUCCIÓ (Gateway + Dashboard, Sense Internet)

  hermes:
    container_name: hermes-pro
    profiles:
      - produccio-ha
    image: *hermes-image
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:8642:8642"   # API Gateway
      - "127.0.0.1:9119:9119"   # Web Dashboard
    volumes:
      - *hermes-workspace
      - *hermes-config
    environment:
       HERMES_DASHBOARD: "1"
       HERMES_DASHBOARD_HOST: "0.0.0.0"
       HERMES_DASHBOARD_PORT: "9119"
       API_SERVER_ENABLED: "true"
       API_SERVER_HOST: "0.0.0.0"
       API_SERVER_PORT: "8642"
       OLLAMA_HOST: "http://ollama:11434"
       ALLOWED_HOSTS: "127.0.0.1,localhost,0.0.0.0"
    networks:
      - ia-net-interna
    depends_on:
      ollama-int:
        condition: service_healthy

  # 3.2.2 HERMES || INICIALITZACIÓ I SETUP (Amb accès a Internet)

  hermes-externa:
    container_name: hermes-ex
    profiles:
      - hermes-externa
    image: *hermes-image
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - *hermes-workspace
      - *hermes-config
    environment:
       HERMES_DASHBOARD: "1"
       HERMES_DASHBOARD_HOST: "0.0.0.0"
       HERMES_DASHBOARD_PORT: "9119"
       API_SERVER_ENABLED: "true"
       API_SERVER_HOST: "0.0.0.0"
       API_SERVER_PORT: "8642"
       OLLAMA_HOST: "http://ollama:11434"
    networks:
      - ia-net-externa
      - ia-net-interna
    depends_on:
      ollama-int:
        condition: service_healthy

  # 3.2.3 HERMES || TERMINAL / MANTENIMENT INTERN (Sense Internet)

  hermes-interna:
    container_name: hermes-in
    profiles:
      - hermes-interna
    image: *hermes-image
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    volumes:
      - *hermes-workspace
      - *hermes-config
    environment:
       HERMES_DASHBOARD: "1"
       HERMES_DASHBOARD_HOST: "0.0.0.0"
       HERMES_DASHBOARD_PORT: "9119"
       API_SERVER_ENABLED: "true"
       API_SERVER_HOST: "0.0.0.0"
       API_SERVER_PORT: "8642"
       OLLAMA_HOST: "http://ollama:11434"
    networks:
      - ia-net-interna
    depends_on:
      ollama-int:
        condition: service_healthy


  # ----------------------------------------
  # 3.3.1 OPEN WEBUI
  # ----------------------------------------
  open-webui:
    container_name: open-webui-pro
    profiles:
      - produccio-ow
    image: *open-webui-image
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - *webui-storage
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=canvia-aquesta-clau-per-una-de-molt-llarga-i-aleatoria-64-chars
      - ENABLE_KB_EXEC=True
      - RAG_SYSTEM_CONTEXT=True
      - WEBUI_AUTH=true
      - DEFAULT_USER_ROLE=pending
    networks:
      - ia-net-interna
    depends_on:
      ollama-int:
        condition: service_healthy

  # ----------------------------------------
  # 3.3.2 OPEN TERMINAL
  # ----------------------------------------
  open-terminal:
    container_name: open-terminal-pro
    profiles:
      - produccio-ow
    image: *open-terminal-image
    restart: unless-stopped
    volumes:
      - *terminal-storage
      # Opcional: Pots muntar aquí la ruta del teu projecte real si ho desitges
      # - /ruta/absoluta/del/teu/projecte:/home/user/projecte:Z
    environment:
      - OPEN_TERMINAL_API_KEY=altra-clau-aleatoria-forta-per-terminal
      - OPEN_TERMINAL_FILE_BROWSER_ROOT=/home/user
      - OPEN_TERMINAL_EXECUTE_TIMEOUT=30
    networks:
      - ia-net-interna

# ==========================================
# 4. XARXES
# ==========================================

networks:
  ia-net-interna:
    driver: bridge
    internal: true

  ia-net-externa:
    driver: bridge
    internal: false
